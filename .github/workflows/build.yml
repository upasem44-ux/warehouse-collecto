name: Build Android APK

on:
  push:
    branches: [ main, 'ai/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Structure
        run: |
          mkdir -p temp_backup
          cp -r lib temp_backup/
          cp pubspec.yaml temp_backup/
          flutter create . --platforms=android --org com.dawakom
          cp -r temp_backup/lib/* lib/
          cp temp_backup/pubspec.yaml .
          rm -rf temp_backup
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          rmdir test 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run automated tests
        run: flutter test --no-pub

      - name: Analyze Dart code
        run: flutter analyze --no-pub lib

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-collector-app
          path: build/app/outputs/flutter-apk/app-release.apk
